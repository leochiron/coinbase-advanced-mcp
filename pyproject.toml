[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-research"
version = "2.0.0"
description = "Auditable crypto market research, backtesting, risk, and paper-decision system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Strict-1.0.0" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "pyyaml>=6,<7"]

[project.scripts]
crypto-research = "crypto_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
